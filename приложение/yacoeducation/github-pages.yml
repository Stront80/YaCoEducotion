# Скопируйте этот файл в .github/workflows/pages.yml корня YaCoEducotion.
name: Publish YaCoEducation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Проверить реестр и тесты
        run: |
          python3 приложение/yacoeducation/serve.py --check
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s приложение/yacoeducation/tests -p 'test_*.py' -v
          node приложение/yacoeducation/tests/core.test.cjs
      - name: Собрать статический сайт
        run: python3 приложение/yacoeducation/build_static.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
